
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            color: #312e81;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome {
            color: #64748b;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .team-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .member-card {
            background-color: white;
            width: 300px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(49, 46, 129, 0.12);
            transition: transform 0.3s ease;
        }

        .member-card:hover {
            transform: translateY(-6px);
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #e0e7ff;
            color: #3730a3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .member-card h2 {
            color: #312e81;
            font-size: 21px;
            margin-bottom: 12px;
        }

        .member-id {
            color: #64748b;
            font-size: 16px;
            margin: 0;
        }

        footer {
            color: #64748b;
            margin-top: 45px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Our Team</h1>
    <p class="welcome">Meet the members of our team!</p>

    <div class="team-container">

        <div class="member-card">
            <div class="avatar">ZR</div>
            <h2>Zeina Alieldien Reda</h2>
            <p class="member-id">ID: 20240228</p>
        </div>

        <div class="member-card">
            <div class="avatar">SS</div>
            <h2>Salma Mohamed Selim</h2>
            <p class="member-id">ID: 20240238</p>
        </div>

    </div>

    <footer>
        © 2026 Our Team
    </footer>
</body>
</html>
